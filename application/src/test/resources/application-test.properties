# ============================================================
# Test 環境設定（GitHub Actions CI 專用）
# 只寫跟 application.properties 不同的部分
# ============================================================
# === MySQL（本機用 fin_core，CI 的 MySQL container 也建 fin_core）===
# 全部改成可用環境變數覆蓋。本機 dev 若密碼不同，可 export DB_TEST_PASSWORD=xxx 後再跑 test
# CI 環境會透過 GitHub Actions env 注入正確值
spring.datasource.url=jdbc:mysql://${DB_TEST_HOST:localhost}:3306/fin_core?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Taipei&characterEncoding=utf8
spring.datasource.username=${DB_TEST_USERNAME:root}
spring.datasource.password=${DB_TEST_PASSWORD:123456}
# === Flyway（test 允許 clean，每次 CI 都從乾淨狀態跑）===
spring.flyway.clean-disabled=false
# === Thymeleaf ===
spring.thymeleaf.cache=false
# === Swagger（CI 不需要）===
springdoc.swagger-ui.enabled=false
# === Log（CI 輸出簡化）===
logging.level.root=WARN
logging.level.com.example.novaledger=INFO
logging.level.org.flywaydb=WARN
# === Mail（test 環境不寄信，用 resend provider 避免 JavaMailSender bean 依賴）===
app.email.provider=resend
resend.api-key=test-dummy-key
# === Encryption（test 環境專用，與任何真實 key 不同）===
app.encryption.account-number-key=TestEnvOnlyEncKey00AaBbCcDdEeFf1
