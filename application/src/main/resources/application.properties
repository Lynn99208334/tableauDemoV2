spring.application.name=NovaLedger
server.port=8111

# === MySQL ===
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/fin_core?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=Asia/Taipei&characterEncoding=utf8
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:00000000}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# === HikariCP Connection Pool ===
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1200000

# === JPA ===
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# === Flyway ===
spring.flyway.clean-disabled=true

# === Thymeleaf ===
spring.thymeleaf.cache=true

# === DevTools ===
spring.devtools.restart.enabled=false

# === Multipart ===
# \u6CE8\u610F\uFF1A\u4E0A\u50B3\u5927\u5C0F\u4E0A\u9650\u7684\u696D\u52D9\u8A2D\u5B9A\u5DF2\u79FB\u5165 system_configs.import.max.file.size.mb
# \u6B64\u8655\u4FDD\u7559 Spring \u5C64\u7684\u786C\u4E0A\u9650\uFF08\u9632\u6B62\u8D85\u5927\u8ACB\u6C42\u9032\u5165\u61C9\u7528\u7A0B\u5F0F\uFF09
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB

# === JWT\uFF08\u555F\u52D5\u6642\u5FC5\u8981\uFF0C\u4E0D\u53EF\u79FB\u5165 DB\uFF09===
jwt.secret=${JWT_SECRET:R7kQ9Z2fM6PA8XWmThE4LcJdVYB3S0nU5aKx1bNpQeR}
jwt.expiration=${JWT_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# === Redis\uFF08\u555F\u52D5\u6642\u5FC5\u8981\uFF0C\u4E0D\u53EF\u79FB\u5165 DB\uFF09===
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}
spring.data.redis.timeout=2000
spring.data.redis.database=0

# === Swagger ===
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.enabled=true

# === App Base URL ===
app.base-url=${APP_BASE_URL:http://localhost:8111}

# === Cookie Security（access_token cookie 的 Secure 屬性，dev 預設 false，prod 覆蓋為 true）===
app.cookie.secure=${APP_COOKIE_SECURE:false}

# === Session Cookie（JSESSIONID）安全屬性 ===
# HttpOnly 防 XSS 讀取；SameSite=strict 防 CSRF；Secure 交給 profile 控制（下方 secure 設定）
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${APP_COOKIE_SECURE:false}

# === Session Timeout（15 分鐘，防長時間閒置的 session 被偷用）===
server.servlet.session.timeout=15m

# === Error Response（不洩露 stack trace / exception 訊息給前端）===
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false
server.error.include-binding-errors=never

# === Encryption ===
app.encryption.account-number-key=${ACCOUNT_NUMBER_ENCRYPTION_KEY}

# === Email Provider\uFF08dev / prod \u90FD\u7528 Resend HTTPS API\uFF09===
# \u9810\u8A2D resend\uFF0C\u907F\u514D profile \u672A\u751F\u6548\u6642\u640D\u56DE SMTP
app.email.provider=${APP_EMAIL_PROVIDER:resend}
resend.api-key=${RESEND_API_KEY:}

# === Log ===
logging.level.root=INFO
logging.level.com.example.novaledger=INFO

# ============================================================
# \u4EE5\u4E0B\u8A2D\u5B9A\u5DF2\u79FB\u5165 DB system_configs \u8868\uFF0C\u7531 SystemConfigService \u8B80\u53D6
# \u4E0D\u518D\u5F9E properties \u8B80\u53D6\uFF1A
#   app.auth.skip-email-verify       \u2192 system_configs: email.verify.enabled
#   app.auth.verify-token-expire-minutes \u2192 system_configs: auth.token.expire.minutes
#   app.auth.resend-cooldown-seconds \u2192 system_configs: auth.resend.cooldown.seconds
# ============================================================
